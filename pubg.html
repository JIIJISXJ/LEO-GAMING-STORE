<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Mobile | LEO STORE</title>
    <link rel="stylesheet" href="style.css">
</head><body><header>
    <div class="logo">LEO <span>STORE</span></div>
    <p>PUBG Mobile 🎯</p>
</header><main><section class="hero">
    <h1>PUBG Mobile 🎯</h1>
    <p>شحن UC</p>
</section><section class="contact"><h2>🆔 اكتب ID اللاعب</h2>

<input
    id="playerId"
    type="text"
    inputmode="numeric"
    placeholder="اكتب Player ID هنا"
    style="width:100%;padding:15px;margin:15px 0;border-radius:12px;border:1px solid #292f43;background:#080a12;color:white;font-size:16px;text-align:center;"
>

</section><section class="payment"><h2>🪙 باقات UC</h2>

<button class="payment-card" onclick="orderGame('PUBG Mobile','60 UC','59.99')">
    <div>
        <strong>🪙 60 UC</strong>
        <small>59.99 جنيه</small>
    </div>
    <b>اطلب</b>
</button>

<button class="payment-card" onclick="orderGame('PUBG Mobile','325 UC','299.99')">
    <div>
        <strong>🪙 325 UC</strong>
        <small>299.99 جنيه</small>
    </div>
    <b>اطلب</b>
</button>

<button class="payment-card" onclick="orderGame('PUBG Mobile','660 UC','599.99')">
    <div>
        <strong>🪙 660 UC</strong>
        <small>599.99 جنيه</small>
    </div>
    <b>اطلب</b>
</button>

<button class="payment-card" onclick="orderGame('PUBG Mobile','1800 UC','1499.99')">
    <div>
        <strong>🪙 1800 UC</strong>
        <small>1499.99 جنيه</small>
    </div>
    <b>اطلب</b>
</button>

</section><section class="contact"><a
    class="whatsapp"
    href="https://wa.me/201108302815?text=مرحباً%20LEO%20STORE"
    target="_blank">
    💬 تواصل معنا على واتساب
</a>

</section></main><footer>
    © 2026 LEO STORE
</footer><script>

function orderGame(game, product, price) {

    const playerId =
        document.getElementById("playerId").value.trim();

    if (playerId === "") {

        alert("من فضلك اكتب Player ID أولاً.");

        document.getElementById("playerId").focus();

        return;
    }

    const message =
`مرحباً LEO STORE 👋

🎮 اللعبة: ${game}

📦 الباقة: ${product}

💰 السعر: ${price} جنيه

🆔 Player ID: ${playerId}

أريد طلب هذه الباقة.`;

    const url =
        "https://wa.me/201108302815?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank");
}

</script></body>
</html>
